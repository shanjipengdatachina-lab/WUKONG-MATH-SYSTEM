<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>银河 · 数学 · 寂静</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; width:100%; height:100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hint {
    position:fixed; left:50%; bottom:5%; transform:translateX(-50%);
    color:rgba(180,200,230,0.22); font-family:"Times New Roman",serif;
    font-size:12px; letter-spacing:8px; pointer-events:none;
    animation: fade 8s ease-in-out infinite;
  }
  @keyframes fade { 0%,100%{opacity:0.12} 50%{opacity:0.35} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">DRAG · TO · ROTATE</div>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  // ==================== 星系参数 ====================
  const MAX_R = 420;         // 星系半径
  const NUM_ARMS = 4;        // 旋臂数
  const FOV = 900;           // 焦距
  const CAM_DIST = 950;      // 相机距离

  // ==================== 相机状态 ====================
  let rotY = 0.3;
  let rotX = -0.65;
  let targetRotY = rotY;
  let targetRotX = rotX;
  let velY = 0, velX = 0;
  let dragging = false;
  let lastPX = 0, lastPY = 0;
  let zoom = 1, targetZoom = 1;

  // ==================== 数据 ====================
  let particles = [];
  let bgStars = [];

  // ==================== 公式与思想 ====================
  const FORMULAS = [
    'E = mc²', '∫e^{-x²}dx = √π', 'iℏ∂ψ/∂t = Ĥψ',
    'e^{iπ} + 1 = 0', 'a² + b² = c²', 'φ = (1+√5)/2',
    'ζ(s) = Σ n^{-s}', '∇²φ = 0', 'F = G m₁m₂/r²',
    'π(x) ~ x/ln x', 'H = -Σ p log p', 'S = k_B ln Ω',
    'ΔxΔp ≥ ℏ/2', '∑ 1/n² = π²/6', 'V - E + F = 2',
    '∂²u/∂t² = c²∇²u', 'P = NP ?', '√2 ∉ ℚ',
    'lim (sin x)/x = 1', 'e^x = Σ xⁿ/n!', 'R_{μν} - ½g_{μν}R = 8πT_{μν}',
    'ℵ₀', 'ℝ', 'ℂ', '∞', '∂', '∇', '∫', '∮',
    'φ', 'Ω', 'ψ', 'λ', 'θ',
    '道', '易', '一', '无',
    '欧拉', '高斯', '黎曼', '伽罗瓦', '康托尔', '庞加莱',
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function gauss() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ==================== 生成粒子 ====================
  function makeParticle(r, theta, z, kind) {
    let color, size, alpha;

    if (kind === 'core') {
      // 核心：暖白
      color = [255, 235, 200];
      size = 0.9 + Math.random() * 1.6;
      alpha = 0.55 + Math.random() * 0.45;
    } else if (kind === 'arm') {
      // 旋臂：内暖外冷
      const t = Math.min(1, r / MAX_R);
      color = [
        Math.floor(230 - 40 * t),
        Math.floor(225 - 20 * t),
        Math.floor(230 + 25 * (1 - t)),
      ];
      size = 0.6 + Math.random() * 1.3;
      alpha = 0.4 + Math.random() * 0.5;
    } else if (kind === 'halo') {
      // 弥散：冷蓝
      color = [170, 195, 235];
      size = 0.4 + Math.random() * 1.0;
      alpha = 0.15 + Math.random() * 0.3;
    } else {
      // 公式
      color = [225, 235, 255];
      size = 1;
      alpha = 0.7;
    }

    // 角速度：内圈快、外圈慢（开普勒式）
    const angularSpeed = 0.0024 / (0.4 + r / MAX_R);

    return {
      r, theta, z, kind, color, size, alpha,
      angularSpeed,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.5 + Math.random() * 1.5,
      text: null,
      fontSize: 12,
    };
  }

  function initParticles() {
    particles = [];

    // --- 1. 核心核球 ---
    for (let i = 0; i < 700; i++) {
      const r = Math.pow(Math.random(), 1.9) * MAX_R * 0.16;
      const theta = Math.random() * Math.PI * 2;
      const z = gauss() * 26 * (1 - (r / (MAX_R * 0.16)) * 0.55);
      particles.push(makeParticle(r, theta, z, 'core'));
    }
    // 核心最亮的几颗
    for (let i = 0; i < 40; i++) {
      const r = Math.pow(Math.random(), 2.4) * MAX_R * 0.06;
      const theta = Math.random() * Math.PI * 2;
      const z = gauss() * 10;
      const p = makeParticle(r, theta, z, 'core');
      p.size = 2.2 + Math.random() * 1.6;
      p.alpha = 0.9;
      particles.push(p);
    }

    // --- 2. 旋臂 ---
    for (let i = 0; i < 2600; i++) {
      const arm = i % NUM_ARMS;
      const armAngle = (arm * Math.PI * 2) / NUM_ARMS;
      const r = MAX_R * 0.1 + Math.pow(Math.random(), 0.68) * MAX_R * 0.9;
      // 对数螺旋
      const baseTheta = armAngle + Math.log(r / 26) * 0.95;
      const spread = gauss() * 0.22 * (1 - (r / MAX_R) * 0.35);
      const theta = baseTheta + spread;
      const z = gauss() * 7 * (1 - (r / MAX_R) * 0.5);
      particles.push(makeParticle(r, theta, z, 'arm'));
    }

    // --- 3. 外围弥散晕 ---
    for (let i = 0; i < 700; i++) {
      const r = Math.pow(Math.random(), 0.6) * MAX_R * 1.15;
      const theta = Math.random() * Math.PI * 2;
      const z = gauss() * 22;
      particles.push(makeParticle(r, theta, z, 'halo'));
    }

    // --- 4. 公式星尘 ---
    for (let i = 0; i < 60; i++) {
      const r = MAX_R * (0.2 + Math.random() * 0.85);
      const theta = Math.random() * Math.PI * 2;
      const z = gauss() * 34;
      const p = makeParticle(r, theta, z, 'formula');
      p.text = FORMULAS[Math.floor(Math.random() * FORMULAS.length)];
      p.fontSize = 11 + Math.random() * 9;
      p.angularSpeed *= 0.95;
      particles.push(p);
    }
  }

  // ==================== 背景星空 ====================
  function initBgStars() {
    bgStars = [];
    const n = Math.floor((W * H) / 5200);
    for (let i = 0; i < n; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.3 + Math.random() * 0.9,
        a: 0.08 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        sp: 0.3 + Math.random() * 0.9,
      });
    }
  }

  // ==================== 尺寸 ====================
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initBgStars();
  }

  // ==================== 交互 ====================
  function onDown(x, y) {
    dragging = true;
    lastPX = x; lastPY = y;
    velY = 0; velX = 0;
  }
  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - lastPX;
    const dy = y - lastPY;
    lastPX = x; lastPY = y;
    targetRotY += dx * 0.007;
    targetRotX += dy * 0.006;
    // 限制倾斜角度
    const lim = Math.PI / 2 - 0.08;
    targetRotX = Math.max(-lim, Math.min(lim, targetRotX));
    velY = dx * 0.007;
    velX = dy * 0.006;
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1) {
      onMove(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    targetZoom *= (e.deltaY > 0 ? 0.92 : 1.08);
    targetZoom = Math.max(0.32, Math.min(2.6, targetZoom));
  }, { passive: false });

  // ==================== 主循环 ====================
  let lastT = 0;

  function loop(now) {
    if (!lastT) lastT = now;
    let dt = (now - lastT) / 16.667;  // 归一化到 60fps 单位
    lastT = now;
    if (dt > 3) dt = 3;

    // 惯性 + 自动旋转
    if (!dragging) {
      targetRotY += velY * dt;
      targetRotX += velX * dt;
      const lim = Math.PI / 2 - 0.08;
      targetRotX = Math.max(-lim, Math.min(lim, targetRotX));
      velY *= Math.pow(0.94, dt);
      velX *= Math.pow(0.94, dt);
      // 缓慢自动旋转
      targetRotY += 0.0005 * dt;
    }

    // 平滑逼近
    rotY += (targetRotY - rotY) * 0.09 * dt;
    rotX += (targetRotX - rotX) * 0.09 * dt;
    zoom += (targetZoom - zoom) * 0.08 * dt;

    draw(now, dt);
    requestAnimationFrame(loop);
  }

  function draw(time, dt) {
    // ---- 背景 ----
    ctx.fillStyle = '#000105';
    ctx.fillRect(0, 0, W, H);

    // ---- 背景星空 ----
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const a = s.a * (0.55 + 0.45 * Math.sin(time * 0.0007 * s.sp + s.phase));
      ctx.fillStyle = `rgba(200,215,240,${a.toFixed(3)})`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    const cx = W / 2;
    const cy = H / 2;

    // ---- 相机旋转矩阵 ----
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

    // ---- 投影所有粒子 ----
    const projected = [];

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // 更新角度（缓慢自转）
      p.theta += p.angularSpeed * dt;

      // 世界坐标：星系平面为 XZ 平面，Y 为厚度
      const px = p.r * Math.cos(p.theta);
      const py = p.z;
      const pz = p.r * Math.sin(p.theta);

      // 绕 Y 轴旋转
      const x1 = px * cosY - pz * sinY;
      const z1 = px * sinY + pz * cosY;
      const y1 = py;

      // 绕 X 轴旋转
      const y2 = y1 * cosX - z1 * sinX;
      const z2 = y1 * sinX + z1 * cosX;
      const x2 = x1;

      // 透视投影
      const depth = z2 + CAM_DIST;
      if (depth < 80) continue;
      const scale = (FOV / depth) * zoom;

      const sx = cx + x2 * scale;
      const sy = cy + y2 * scale;

      // 视野剔除
      if (sx < -120 || sx > W + 120 || sy < -120 || sy > H + 120) continue;

      // 深度亮度：越远越暗
      const depthAlpha = Math.max(0.06, Math.min(1.1, 520 / depth));

      projected.push({
        x: sx, y: sy,
        depth,
        scale,
        p,
        alpha: p.alpha * depthAlpha,
      });
    }

    // ---- 绘制 ----
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < projected.length; i++) {
      const q = projected[i];
      const p = q.p;

      if (p.kind === 'formula') {
        // 公式星尘
        const flicker = 0.7 + 0.3 * Math.sin(time * 0.0011 + p.phase);
        const a = q.alpha * flicker * 0.85;
        if (a < 0.03) continue;
        const fs = p.fontSize * q.scale * 1.35;
        if (fs < 4.5) continue;
        ctx.font = `${fs.toFixed(1)}px "Times New Roman","Cambria Math",serif`;
        ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a.toFixed(3)})`;
        ctx.fillText(p.text, q.x, q.y);
      } else {
        // 星点
        const flicker = 0.7 + 0.3 * Math.sin(time * 0.001 * p.twinkle + p.phase);
        const a = q.alpha * flicker;
        if (a < 0.025) continue;

        const r = Math.max(0.4, p.size * q.scale * (0.85 + 0.3 * flicker));

        // 外发光
        if (r > 1.1) {
          ctx.beginPath();
          ctx.arc(q.x, q.y, r * 2.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${(a * 0.12).toFixed(3)})`;
          ctx.fill();
        }

        // 星点本体
        ctx.beginPath();
        ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a.toFixed(3)})`;
        ctx.fill();
      }
    }

    // ---- 核心光晕（叠加在中心）----
    const coreR = Math.min(W, H) * 0.32 * zoom;
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    coreGrad.addColorStop(0, 'rgba(255,240,215,0.22)');
    coreGrad.addColorStop(0.25, 'rgba(220,220,250,0.08)');
    coreGrad.addColorStop(0.6, 'rgba(140,170,230,0.03)');
    coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // ==================== 启动 ====================
  resize();
  initParticles();
  requestAnimationFrame(loop);

  let rt = null;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(resize, 150);
  });
  window.addEventListener('orientationchange', () => setTimeout(resize, 260));
})();
</script>
</body>
</html>
