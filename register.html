    <main>
      <div class="auth">
        <section class="auth__form">
          <p class="auth__mark">账户</p>
          <h1 class="auth__title">注册</h1>
          <p class="auth__sub">创建账号后，错题本、收藏夹与学习进度会跟随你。</p>

          <form class="auth__fields" action="#" method="post" novalidate>
            <div class="field">
              <label class="field__label" for="nickname">昵称</label>
              <input class="field__input" id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="用于论坛显示">
            </div>

            <div class="field">
              <label class="field__label" for="phone">手机号</label>
              <input class="field__input" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入 11 位手机号">
            </div>

            <div class="field">
              <label class="field__label" for="code">验证码</label>
              <div class="field__row">
                <input class="field__input" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码">
                <button type="button" class="btn btn--ghost btn--sm" style="height:42px">获取验证码</button>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="password">密码</label>
              <input class="field__input" id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位，含字母与数字">
              <p class="field__hint">密码需包含字母与数字，长度不少于 8 位。</p>
            </div>

            <div class="auth__check">
              <input type="checkbox" id="terms" name="terms">
              <label for="terms">我已阅读并同意<a href="terms.html" data-dom-id="register-terms">《用户协议》</a>与<a href="privacy.html" data-dom-id="register-privacy">《隐私政策》</a></label>
            </div>

            <a class="btn btn--primary btn--block" href="profile.html" data-dom-id="register-submit">注册</a>
          </form>

          <p class="auth__foot">已有账号？<a href="login.html" data-dom-id="register-login">直接登录</a></p>
        </section>

        <aside class="auth__aside">
          <p class="auth__mark">注册后可用</p>
          <div class="auth__bullets">
            <div class="auth__bullet">
              <span class="auth__bullet-no">01</span>
              <div class="auth__bullet-body">
                <p class="auth__bullet-title">错题本</p>
                <p class="auth__bullet-desc">自动收集练习中的错题，按章节归档，可以逐题订正。</p>
              </div>
            </div>
            <div class="auth__bullet">
              <span class="auth__bullet-no">02</span>
              <div class="auth__bullet-body">
                <p class="auth__bullet-title">收藏夹</p>
                <p class="auth__bullet-desc">把知识点、题目与论坛帖子收藏到一处，随时回看。</p>
              </div>
            </div>
            <div class="auth__bullet">
              <span class="auth__bullet-no">03</span>
              <div class="auth__bullet-body">
                <p class="auth__bullet-title">学习进度</p>
                <p class="auth__bullet-desc">六册二十九章的完成度一目了然，薄弱章节优先复习。</p>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>

.auth__title{text-wrap:balance;word-break:keep-all}.auth__bullet-body{flex:1 1 auto;min-width:0}.auth__bullet-no{flex:0 0 auto;font-variant-numeric:tabular-nums}.auth__bullet-title{text-wrap:balance;word-break:keep-all}.auth__check a{color:var(--math-ink-2);text-decoration:none;transition:color 140ms cubic-bezier(.2,.8,.2,1)}.auth__check a:hover{color:var(--math-primary)}.field__input:disabled{background:var(--math-surface);color:var(--math-ink-4);border-color:var(--math-border);cursor:not-allowed}.field__input:disabled:hover{border-color:var(--math-border)}.auth__check a:focus-visible,.auth__check input:focus-visible{outline:2px solid var(--math-ring);outline-offset:2px}.field__input,.btn,.auth__bullet-no{font-variant-numeric:tabular-nums}@media (max-width:420px){.field__row{grid-template-columns:minmax(0,1fr)}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}</style>
