<main>
  <div class="auth">
    <section class="auth__form" aria-labelledby="reset-title">
      <p class="auth__mark">账户</p>
      <h1 class="auth__title" id="reset-title">找回密码</h1>
      <p class="auth__sub">用注册时的手机号验证身份，然后设置新密码。</p>

      <div class="steps" role="list" aria-label="重置密码步骤">
        <div class="steps__item" role="listitem" data-active="true" aria-current="step">
          <span class="steps__no">01</span>
          <span>验证手机号</span>
        </div>
        <div class="steps__sep" aria-hidden="true"></div>
        <div class="steps__item" role="listitem">
          <span class="steps__no">02</span>
          <span>设置新密码</span>
        </div>
        <div class="steps__sep" aria-hidden="true"></div>
        <div class="steps__item" role="listitem">
          <span class="steps__no">03</span>
          <span>完成</span>
        </div>
      </div>

      <form class="auth__fields" novalidate>
        <div class="field">
          <label class="field__label" for="reset-phone">手机号</label>
          <input class="field__input" id="reset-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入注册时的手机号">
        </div>

        <div class="field">
          <label class="field__label" for="reset-code">验证码</label>
          <div class="field__row">
            <input class="field__input" id="reset-code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码">
            <button type="button" class="btn btn--ghost" style="height:42px">获取验证码</button>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="reset-password">新密码</label>
          <input class="field__input" id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位，含字母与数字">
          <p class="field__hint">新密码不能与旧密码相同。</p>
        </div>

        <a class="btn btn--primary btn--block" href="login.html" data-dom-id="reset-submit">重置密码</a>
      </form>

      <p class="auth__foot">想起密码了？<a href="login.html" data-dom-id="reset-login">返回登录</a></p>
    </section>

    <aside class="auth__aside">
      <p class="auth__formula">(a − b)<sup>2</sup> = a<sup>2</sup> − 2ab + b<sup>2</sup></p>
      <p class="auth__note">完全平方公式，第十四章的内容。账号只是为了让你回来时，错题和进度还在原处。</p>
    </aside>
  </div>
</main>
