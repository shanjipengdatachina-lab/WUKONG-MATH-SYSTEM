    <style id="shell-styles">
.shell-footer{border-top:1px solid var(--math-border);background:var(--math-background);margin-top:80px}.shell-footer__inner{max-width:1280px;margin:0 auto;padding:32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}.shell-footer__legal{font-size:calc(12px * var(--math-fs));color:var(--math-ink-3)}.shell-footer__links{display:flex;flex-wrap:wrap;gap:24px}.shell-footer__link{font-size:calc(13px * var(--math-fs));color:var(--math-ink-2);text-decoration:none;transition:color 140ms cubic-bezier(.2,.8,.2,1)}.shell-footer__link:hover{color:var(--math-primary)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:var(--math-radius-md);font-size:calc(14px * var(--math-fs));font-weight:500;line-height:1;text-decoration:none;cursor:pointer;transition:background-color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1),color 140ms cubic-bezier(.2,.8,.2,1)}.btn--primary{background:var(--math-primary);color:var(--math-primary-foreground);border:1px solid var(--math-primary)}.btn--primary:hover{background:var(--math-primary-strong);border-color:var(--math-primary-strong)}.btn--ghost{background:transparent;color:var(--math-ink);border:1px solid var(--math-border)}.btn--ghost:hover{border-color:var(--math-line-strong);color:var(--math-foreground)}.btn--sm{height:32px;padding:0 12px;font-size:calc(13px * var(--math-fs))}.btn:focus-visible,.shell-footer__link:focus-visible{outline:2px solid var(--math-ring);outline-offset:2px}body{padding-top:0}
</style>
    <style id="page-styles">
.acct{max-width:1280px;margin:0 auto;padding:36px 32px 0;display:grid;grid-template-columns:216px minmax(0,1fr);gap:48px;align-items:start}.acct-side{position:sticky;top:88px}.acct-side__title{font-size:calc(12px * var(--math-fs));color:var(--math-ink-3);letter-spacing:.08em;padding:0 12px 10px}.acct-side__nav{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--math-border);padding-top:10px}.acct-side__item{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-radius:var(--math-radius-sm);font-size:calc(14px * var(--math-fs));color:var(--math-ink-2);text-decoration:none;transition:background-color 140ms cubic-bezier(.2,.8,.2,1),color 140ms cubic-bezier(.2,.8,.2,1)}.acct-side__item:hover{background:var(--math-surface);color:var(--math-foreground)}.acct-side__item[data-active="true"]{color:var(--math-primary);font-weight:500}.acct-main{min-width:0}.page-head{border-bottom:1px solid var(--math-border);padding-bottom:20px;margin-bottom:24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}.page-head__crumb{font-size:calc(12px * var(--math-fs));color:var(--math-ink-3);margin-bottom:10px;flex:1 0 100%}.page-head__title{font-size:calc(clamp(1.75rem,3vw,2.25rem) * var(--math-fs));font-weight:600;letter-spacing:-0.02em;line-height:1.25;color:var(--math-foreground)}.page-head__desc{font-size:calc(14px * var(--math-fs));color:var(--math-ink-2);margin-top:8px;line-height:1.7;max-width:52em}.page-head__acts{display:flex;gap:10px}.sec{margin-top:36px}.sec__head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}.sec__title{font-size:calc(15px * var(--math-fs));font-weight:600;color:var(--math-foreground)}.sec__note{font-size:calc(12px * var(--math-fs));color:var(--math-ink-3);margin-left:auto}.wk-note{margin:0;padding:18px 0;font-size:calc(13px * var(--math-fs));line-height:1.9;color:var(--math-ink-3)}.link-plain{color:var(--math-primary);text-decoration:none}

/* ---- 图片查看器 ---- */
.viewer{border:1px solid var(--math-border);border-radius:var(--math-radius-md);overflow:hidden}
.viewer__tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--math-border);flex-wrap:wrap;background:var(--math-surface)}
.viewer__tab{padding:6px 14px;border-radius:var(--math-radius-sm);font-size:calc(13px * var(--math-fs));cursor:pointer;border:1px solid transparent;color:var(--math-ink-2);background:transparent;transition:all 140ms}
.viewer__tab:hover{color:var(--math-foreground)}
.viewer__tab[data-on="1"]{background:var(--math-background);border-color:var(--math-border);color:var(--math-primary);font-weight:500}
.viewer__stage{position:relative;min-height:360px;background:
  linear-gradient(45deg,var(--math-surface) 25%,transparent 25%),
  linear-gradient(-45deg,var(--math-surface) 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,var(--math-surface) 75%),
  linear-gradient(-45deg,transparent 75%,var(--math-surface) 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;
  background-color:var(--math-background);overflow:auto}
.viewer__img-wrap{position:relative;display:inline-block;margin:24px;line-height:0}
.viewer__img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.viewer__overlay{position:absolute;inset:0;cursor:crosshair}
.viewer__tools{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--math-border);background:var(--math-surface)}
.viewer__tool{font-size:calc(12px * var(--math-fs));color:var(--math-ink-3);margin-right:auto}

/* ---- 错题框（覆盖层上的 box）---- */
.box-mark{position:absolute;border:2px solid #ef4444;background:rgba(239,68,68,.12);box-sizing:border-box;cursor:pointer;transition:background 120ms}
.box-mark:hover{background:rgba(239,68,68,.22)}
.box-mark[data-sel="1"]{border-color:#2563eb;background:rgba(37,99,235,.18)}
.box-mark__q{position:absolute;top:-10px;left:-2px;background:var(--math-state-error);color:var(--math-primary-foreground);font-size:calc(11px * var(--math-fs));padding:1px 6px;border-radius:4px;font-weight:600;line-height:1.4}
.box-mark[data-sel="1"] .box-mark__q{background:#2563eb}
.box-draft{position:absolute;border:2px dashed #2563eb;background:rgba(37,99,235,.08);box-sizing:border-box;pointer-events:none}

/* ---- 错题列表 ---- */
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.box-card{border:1px solid var(--math-border);border-radius:var(--math-radius-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.box-card[data-sel="1"]{border-color:var(--math-primary);box-shadow:0 0 0 1px var(--math-primary)}
.box-card__row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box-card__lab{font-size:calc(12px * var(--math-fs));color:var(--math-ink-3);width:48px;flex-shrink:0}
.box-card input[type=number],.box-card input[type=text]{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);background:var(--math-background);color:var(--math-foreground);font-size:calc(13px * var(--math-fs));font-family:inherit}
.box-card input:focus-visible{outline:2px solid var(--math-ring);outline-offset:1px}
.box-card__node{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);background:var(--math-surface);color:var(--math-ink-2);font-size:calc(13px * var(--math-fs));cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box-card__node:hover{border-color:var(--math-line-strong)}
.box-card__node[data-set="1"]{color:var(--math-foreground)}
.box-card__del{margin-left:auto;padding:4px 8px;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);background:transparent;color:var(--math-ink-3);cursor:pointer;font-size:calc(12px * var(--math-fs))}
.box-card__del:hover{color:#b42318;border-color:#b42318}
.box-card__page{font-size:calc(11px * var(--math-fs));color:var(--math-ink-3);padding:2px 8px;border-radius:999px;background:var(--math-surface)}

.save-bar{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--math-border)}
.save-bar__msg{font-size:calc(13px * var(--math-fs));color:var(--math-ink-3)}
.save-bar__msg[data-tone="bad"]{color:#b42318}
.save-bar__msg[data-tone="ok"]{color:var(--math-primary)}

/* ---- 知识点弹窗 ---- */
.modal{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center}
.modal[hidden]{display:none}
.modal__mask{position:absolute;inset:0;background:rgba(11,14,20,.55)}
.modal__panel{position:relative;width:min(520px,92vw);max-height:70vh;background:var(--math-background);border:1px solid var(--math-border);border-radius:var(--math-radius-lg);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal__head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--math-border)}
.modal__title{margin:0;font-size:calc(15px * var(--math-fs));font-weight:600;color:var(--math-foreground)}
.modal__x{width:32px;height:32px;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);background:transparent;color:var(--math-ink-2);cursor:pointer;font-size:calc(18px * var(--math-fs));line-height:1}
.modal__x:hover{color:var(--math-foreground)}
.modal__body{padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.modal__search{padding:8px 10px;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);background:var(--math-background);color:var(--math-foreground);font-size:calc(14px * var(--math-fs));font-family:inherit}
.modal__search:focus-visible{outline:2px solid var(--math-ring);outline-offset:1px}
.modal__list{flex:1;overflow:auto;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);max-height:42vh}
.modal__item{padding:8px 12px;font-size:calc(13px * var(--math-fs));color:var(--math-ink-2);cursor:pointer;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--math-border)}
.modal__item:last-child{border-bottom:none}
.modal__item:hover{background:var(--math-surface)}
.modal__item b{color:var(--math-foreground);font-weight:500}
.modal__item span{font-size:calc(11px * var(--math-fs));color:var(--math-ink-3)}
.modal__empty{padding:24px;text-align:center;font-size:calc(13px * var(--math-fs));color:var(--math-ink-3)}

@media (max-width:1023px){.acct{grid-template-columns:minmax(0,1fr);gap:24px;padding-top:24px}.acct-side{position:static}}
@media (max-width:767px){.viewer__tools{flex-wrap:wrap}}
