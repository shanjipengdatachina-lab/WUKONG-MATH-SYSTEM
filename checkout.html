    <main>
      <div class="wrap">
        <nav class="crumb" aria-label="面包屑">
          <a href="membership.html" data-dom-id="checkout-back">会员中心</a>
          <span aria-hidden="true">／</span>

        </nav>

        <div class="phead">
          <h1 class="phead__title">确认订单</h1>
        </div>

        <div class="cols">
          <div class="form">
            <section class="fsec">
              <h2 class="fsec__title">方案</h2>
              <div class="frow">
                <span class="frow__label">已选</span>
                <div class="picks">
                  <a class="pick" href="#"><span class="pick__mark"></span>免费版</a>
                  <a class="pick" href="#" data-active="true"><span class="pick__mark"></span>会员版</a>
                  <a class="pick" href="#"><span class="pick__mark"></span>尊享版</a>
                </div>
              </div>
            </section>

            <section class="fsec">
              <h2 class="fsec__title">订阅周期</h2>
              <div class="frow">
                <span class="frow__label">周期</span>
                <div class="seg">
                  <a class="seg__item" href="#" data-active="true">按月</a>
                  <a class="seg__item" href="#">按季</a>
                  <a class="seg__item" href="#">按年</a>
                </div>
              </div>
            </section>

            <section class="fsec">
              <h2 class="fsec__title">支付方式</h2>
              <div class="frow">
                <span class="frow__label">方式</span>
                <div class="picks">
                  <a class="pick" href="#" data-active="true"><span class="pick__mark"></span>微信支付</a>
                  <a class="pick" href="#"><span class="pick__mark"></span>支付宝</a>
                  <a class="pick" href="#"><span class="pick__mark"></span>银行卡</a>
                </div>
              </div>
            </section>

            <section class="fsec">
              <h2 class="fsec__title">发票信息</h2>
              <div class="frow">
                <label class="frow__label" for="invoice-title">发票</label>
                <div class="field">
                  <input class="field__input" id="invoice-title" type="text" placeholder="不开发票（可留空）">
                </div>
              </div>
              <div class="frow">
                <label class="frow__label" for="invoice-email">邮箱</label>
                <div class="field">
                  <input class="field__input" id="invoice-email" type="email" placeholder="接收电子发票的邮箱">
                </div>
              </div>
            </section>
          </div>

          <aside class="summary" aria-label="金额明细">
            <h2 class="summary__title">金额明细</h2>
            <div class="srow">
              <span class="srow__label">会员版 · 按月</span>
              <span class="srow__val">¥29.00</span>
            </div>
            <div class="srow">
              <span class="srow__label">首月优惠</span>
              <span class="srow__val srow__val--off">−¥10.00</span>
            </div>
            <div class="srow">
              <span class="srow__label">优惠码</span>
              <span class="srow__val">未使用</span>
            </div>
            <div class="total">
              <span class="total__label">应付金额</span>
              <span class="total__val">¥19.00</span>
            </div>
            <a class="btn btn--primary btn--block" href="payment-result.html" data-dom-id="checkout-submit">提交订单</a>
            <p class="agreement"><a href="payment-failed.html">支付未完成？</a></p>
            <p class="agreement">提交即表示同意《<a href="terms.html">用户协议</a>》与《<a href="privacy.html">隐私政策</a>》，到期前可随时取消。</p>
          </aside>
        </div>
