<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字白板 · 悟空数学</title>
  <!-- 阅读与显示设置：首屏前应用（字号方案 / 亮中暗配色）-->
  <script src="assets/js/display.js"></script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <script src="assets/js/lucide.min.js"></script>
  <style id="wb-styles">
/* ---------- 画板（独占整屏，不再有左右固定栏） ---------- */
/* 注意：ide.css 里 @media(min-width:1024px) 的 .reader-shell 会把网格拆成三列，
   白板必须始终单列，所以这里用双类选择器（.reader-shell.wb-shell）压过它。 */
.reader-shell.wb-shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.wb-stage{grid-column:1;grid-row:1}

/* ---------- 悬浮题库面板（可拖动） ---------- */
.wb-bank{
  position:absolute;left:20px;bottom:80px;z-index:7;
  width:300px;max-width:calc(100% - 40px);
  max-height:min(560px,72vh);
  display:flex;flex-direction:column;
  overflow:hidden;
  border:1px solid var(--math-border);border-radius:16px;
  background:var(--math-background);
  box-shadow:0 16px 44px rgba(15,23,42,.16);
}
.wb-bank[hidden]{display:none}
.wb-bank__head{
  display:flex;align-items:center;gap:8px;flex:none;
  padding:9px 10px 9px 9px;
  border-bottom:1px solid var(--math-border);
  background:var(--math-surface);
  cursor:grab;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
.wb-bank__head:active{cursor:grabbing}
.wb-bank__grip{flex:none;width:15px;height:15px;color:var(--math-ink-4)}
.wb-bank__title{font-size:calc(13px * var(--math-fs));font-weight:600;color:var(--math-foreground)}
.wb-bank__count{margin-left:auto;font-size:calc(11.5px * var(--math-fs));color:var(--math-ink-4);font-variant-numeric:tabular-nums}
.wb-bank__close{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;padding:0;
  border:1px solid transparent;border-radius:var(--math-radius-sm);
  background:none;color:var(--math-ink-3);cursor:pointer;
  transition:color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-bank__close svg{width:14px;height:14px}
.wb-bank__close:hover{border-color:var(--math-border);color:var(--math-foreground)}
.wb-bank__close:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}
.wb-bank.is-dragging{box-shadow:0 22px 60px rgba(15,23,42,.22)}
.wb-bank.is-dragging .wb-bank__head{cursor:grabbing}
.wb-filters{display:flex;flex-wrap:wrap;gap:6px;flex:none;padding:10px 12px 4px}
.wb-filters button{
  height:24px;padding:0 9px;
  border:1px solid var(--math-border);border-radius:999px;
  background:var(--math-background);color:var(--math-ink-3);
  font:inherit;font-size:calc(12px * var(--math-fs));line-height:1;cursor:pointer;
  transition:color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1),background-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-filters button:hover{border-color:var(--math-line-strong);color:var(--math-foreground)}
.wb-filters button.is-on{border-color:var(--math-primary);background:var(--math-primary-soft);color:var(--math-primary)}
.wb-filters button:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}
.wb-search{
  display:flex;align-items:center;gap:8px;height:32px;flex:none;margin:8px 12px;
  padding:0 10px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-md);
  color:var(--math-ink-4);
  transition:border-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-search:focus-within{border-color:var(--math-primary-200)}
.wb-search svg{flex:none;width:15px;height:15px}
.wb-search input{
  flex:1 1 auto;min-width:0;height:100%;
  border:0;background:none;outline:none;
  font:inherit;font-size:calc(13px * var(--math-fs));color:var(--math-foreground);
}
.wb-search input::placeholder{color:var(--math-ink-4)}
.wb-list{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;
  padding:0 10px 12px;
}
.wb-item{
  display:flex;flex-direction:column;gap:4px;width:100%;
  padding:9px 10px;text-align:left;
  border:1px solid transparent;border-radius:var(--math-radius-md);
  background:none;cursor:pointer;font:inherit;
  transition:background-color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-item:hover{background:var(--math-surface)}
.wb-item:focus-visible{outline:2px solid var(--math-primary);outline-offset:-2px}
.wb-item__tag{font-size:calc(11px * var(--math-fs));color:var(--math-ink-4)}
.wb-item__text{font-size:calc(13.5px * var(--math-fs));line-height:1.55;color:var(--math-foreground);overflow-wrap:break-word}
.wb-item__cue{font-size:calc(11px * var(--math-fs));color:var(--math-ink-4);opacity:0;transition:opacity 140ms cubic-bezier(.2,.8,.2,1)}
.wb-item:hover .wb-item__cue{opacity:1}
.wb-item.is-active{border-color:var(--math-primary-200);background:var(--math-primary-soft)}
.wb-item.is-active .wb-item__cue{opacity:1;color:var(--math-primary)}
.wb-empty{margin:16px 6px;font-size:calc(13px * var(--math-fs));color:var(--math-ink-4)}
.wb-list::-webkit-scrollbar{width:8px}
.wb-list::-webkit-scrollbar-thumb{background:var(--math-surface-2);border-radius:8px}

/* ---------- 白板 ---------- */
.wb-stage{position:relative;height:100vh;min-width:0}
.wb-canvas-wrap{
  position:absolute;inset:0;overflow:hidden;
  background:var(--wb-board,var(--math-background));touch-action:none;
}
#wb-canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none;overscroll-behavior:contain}

/* ---------- 悬浮工具条（底部居中，平时半透明，用时全亮） ---------- */
.wb-dock{
  position:absolute;left:50%;bottom:18px;z-index:5;
  transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;
  max-width:calc(100% - 24px);
  padding:5px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-lg);
  background:var(--math-dock);
  box-shadow:0 6px 24px rgba(15,23,42,.10);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:.34;
  transition:opacity 180ms cubic-bezier(.2,.8,.2,1),box-shadow 180ms cubic-bezier(.2,.8,.2,1);
}
.wb-dock:hover,
.wb-dock:focus-within{opacity:1;box-shadow:0 10px 32px rgba(15,23,42,.16)}
/* 按钮用圆角方形：跟浮层、设置面板同一套方圆，激活态是一块实心的浅色块，
   不再是"圈住图标"的圆环（Figma / Excalidraw / PS 的工具栏都是这个做法） */
.wb-dock__btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;padding:0;
  border:1px solid transparent;border-radius:var(--math-radius-md);
  background:none;color:var(--math-ink-2);cursor:pointer;
  transition:color 140ms cubic-bezier(.2,.8,.2,1),background-color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-dock__btn svg{width:16px;height:16px}
.wb-dock__btn:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-dock__btn:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}
.wb-dock__btn.is-on{border-color:transparent;background:var(--math-primary-tint);color:var(--math-primary)}
.wb-dock__btn.is-on:hover{background:var(--math-primary-200)}
.wb-dock__btn:disabled{color:var(--math-ink-4);cursor:default;background:none}
.wb-dock__sep{width:1px;height:20px;margin:0 3px;background:var(--math-border)}
.wb-dock__dot{
  position:absolute;right:4px;bottom:4px;
  width:7px;height:7px;border-radius:999px;
  border:1px solid var(--math-background);background:var(--math-foreground);
}
.wb-dock__level{
  min-width:44px;height:34px;padding:0 6px;
  border:0;border-radius:var(--math-radius-md);background:none;cursor:pointer;
  font:inherit;font-size:calc(11.5px * var(--math-fs));color:var(--math-ink-2);font-variant-numeric:tabular-nums;
  transition:color 140ms cubic-bezier(.2,.8,.2,1),background-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-dock__level:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-dock__level:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}

/* ---------- 悬浮提示：自绘小气泡，替掉系统那层灰框气泡 ---------- */
[data-wb-tip]{position:relative}
[data-wb-tip]::after{
  content:attr(data-wb-tip);
  position:absolute;left:50%;bottom:calc(100% + 16px);z-index:9;
  transform:translateX(-50%) translateY(2px);
  padding:4px 8px;
  border-radius:var(--math-radius-sm);
  background:var(--math-foreground);color:var(--math-background);
  font-size:calc(11.5px * var(--math-fs));font-weight:400;line-height:1.45;white-space:nowrap;
  pointer-events:none;
  box-shadow:0 8px 22px rgba(15,23,42,.22);
  opacity:0;visibility:hidden;
  transition:opacity 120ms cubic-bezier(.2,.8,.2,1),transform 120ms cubic-bezier(.2,.8,.2,1),visibility 120ms;
}
[data-wb-tip]:hover::after,
[data-wb-tip]:focus-visible::after{
  opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);
}
/* 工具组浮层已经展开时不再弹提示，免得两块叠在一起 */
[data-wb-tip][aria-expanded="true"]::after{display:none}

/* ---------- 工具组（仿 PS：同类工具合成一个格子，点开再选） ---------- */
.wb-dock__group{position:relative;display:inline-flex;align-items:center}
/* 格子里同时放着这一组的图标，只有当前那个露出来 */
.wb-dock__slot{display:none}
.wb-dock__btn--group .wb-dock__slot svg{width:16px;height:16px}
.wb-dock__btn--group[data-active="pen"] [data-wb-ico="pen"],
.wb-dock__btn--group[data-active="highlighter"] [data-wb-ico="highlighter"],
.wb-dock__btn--group[data-active="eraser"] [data-wb-ico="eraser"],
.wb-dock__btn--group[data-active="line"] [data-wb-ico="line"],
.wb-dock__btn--group[data-active="arrow"] [data-wb-ico="arrow"],
.wb-dock__btn--group[data-active="rect"] [data-wb-ico="rect"],
.wb-dock__btn--group[data-active="ellipse"] [data-wb-ico="ellipse"]{display:inline-flex}
/* 右下角小三角：PS 的用户一眼就知道"里面还有东西" */
.wb-dock__caret{
  position:absolute;right:3px;bottom:3px;width:0;height:0;
  border-left:3.5px solid transparent;border-bottom:3.5px solid currentColor;
  opacity:.45;
  transition:opacity 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-dock__btn--group[aria-expanded="true"]{background:var(--math-surface);color:var(--math-foreground)}
.wb-dock__btn--group[aria-expanded="true"] .wb-dock__caret{opacity:.9}

/* ---------- 工具组浮层：贴在该格子上方（紧凑排布，一行一个工具） ---------- */
.wb-flyout{
  position:absolute;left:50%;bottom:calc(100% + 6px);z-index:8;
  transform:translateX(-50%);
  display:flex;flex-direction:column;gap:1px;
  min-width:146px;padding:4px;
  border:1px solid var(--math-border);border-radius:12px;
  background:var(--math-background);
  box-shadow:0 14px 36px rgba(15,23,42,.16);
}
.wb-flyout[hidden]{display:none}
.wb-flyout__item{
  display:flex;align-items:center;gap:7px;width:100%;
  height:26px;padding:0 7px;
  border:0;border-radius:6px;background:none;cursor:pointer;
  font:inherit;font-size:calc(12.5px * var(--math-fs));line-height:1;color:var(--math-ink-2);text-align:left;
  transition:background-color 140ms cubic-bezier(.2,.8,.2,1),color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-flyout__item svg{flex:none;width:14px;height:14px}
.wb-flyout__item:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-flyout__item:focus-visible{outline:2px solid var(--math-primary);outline-offset:-2px}
.wb-flyout__item.is-on{background:var(--math-primary-tint);color:var(--math-primary)}
.wb-flyout__label{flex:1 1 auto;min-width:0}
.wb-flyout__item kbd{
  flex:none;min-width:16px;padding:1px 4px;
  border:1px solid var(--math-border);border-radius:4px;
  background:var(--math-surface);
  font-family:var(--math-font-mono);font-size:calc(10px * var(--math-fs));line-height:1.4;text-align:center;color:var(--math-ink-3);
}

/* ---------- 悬浮设置面板（同样收紧一档） ---------- */
.wb-pop{
  position:absolute;left:50%;bottom:74px;z-index:6;
  transform:translateX(-50%);
  width:min(320px,calc(100% - 24px));
  padding:12px 14px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-lg,16px);
  background:var(--math-background);
  box-shadow:0 14px 36px rgba(15,23,42,.16);
}
.wb-pop[hidden]{display:none}
.wb-pop__row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wb-pop__row:last-of-type{margin-bottom:0}
.wb-pop__label{flex:0 0 30px;font-size:calc(11.5px * var(--math-fs));letter-spacing:.06em;color:var(--math-ink-3)}
.wb-colors{display:flex;flex-wrap:wrap;gap:6px}
.wb-swatch{
  width:22px;height:22px;padding:2px;cursor:pointer;
  border:1px solid var(--math-border);border-radius:999px;background:none;
  transition:border-color 140ms cubic-bezier(.2,.8,.2,1),box-shadow 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-swatch span{display:block;width:100%;height:100%;border-radius:999px;background:var(--wb-swatch)}
.wb-swatch:hover{border-color:var(--math-line-strong)}
.wb-swatch:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}
.wb-swatch.is-on{border-color:var(--math-primary);box-shadow:0 0 0 2px var(--math-primary-soft)}
.wb-sizes{display:flex;gap:5px}
.wb-size{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:26px;cursor:pointer;
  border:1px solid var(--math-border);border-radius:var(--math-radius-sm);
  background:var(--math-background);
  transition:border-color 140ms cubic-bezier(.2,.8,.2,1),background-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-size:hover{border-color:var(--math-line-strong)}
.wb-size:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}
.wb-size.is-on{border-color:var(--math-primary);background:var(--math-primary-soft)}
.wb-size__dot{display:block;border-radius:999px;background:var(--math-foreground)}
.wb-size__ring{display:block;border-radius:999px;border:1.5px dashed var(--math-ink-3)}
.wb-pop__foot{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--math-border);
  font-size:calc(11px * var(--math-fs));line-height:1.55;color:var(--math-ink-4);
}
.wb-pop__keys{display:flex;flex-wrap:wrap;gap:3px 8px}
.wb-pop__keys kbd{
  padding:1px 4px;margin-right:2px;
  border:1px solid var(--math-border);border-radius:4px;
  background:var(--math-surface);
  font-family:var(--math-font-mono);font-size:calc(10px * var(--math-fs));color:var(--math-ink-2);
}
.wb-pop__stat{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.wb-view-btn{
  display:inline-flex;align-items:center;gap:5px;
  height:26px;padding:0 8px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-sm);
  background:var(--math-background);color:var(--math-ink-2);
  font:inherit;font-size:calc(12px * var(--math-fs));cursor:pointer;
  transition:color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-view-btn svg{width:13px;height:13px}
.wb-view-btn:hover{border-color:var(--math-line-strong);color:var(--math-foreground)}
.wb-view-btn:focus-visible{outline:2px solid var(--math-primary);outline-offset:2px}

/* 画布内容对读屏不可见，这里留一份文字镜像 */
.wb-sr{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------- 窄屏：画布依旧独占整屏，题库面板只在宽度上收一点 ---------- */
@media (max-width:1023px){
  .reader-shell.wb-shell{grid-template-columns:minmax(0,1fr)}
  .wb-dock{bottom:12px;opacity:.9;border-radius:12px}
  .wb-pop{bottom:66px}
  .wb-bank{left:12px;right:12px;bottom:66px;width:auto;max-height:56vh}
}
@media (max-width:640px){
  .wb-dock__btn{width:30px;height:30px}
  .wb-dock__btn svg{width:14px;height:14px}
  .wb-dock__level{min-width:40px;height:30px}
  .wb-flyout__item{height:24px;font-size:calc(12px * var(--math-fs))}
}
  </style>
  <!-- 本块只属于白板：wb-styles 那个块是图谱共享样式的母版，
       放进去会被 build_graph_css.rb 改名抄到图谱，变成用不到的死规则。 -->
  <style id="wb-analysis-styles">
/* 「分析 / 答案」两个按钮：锚在题面右上角，跟着板走、字号不跟缩。
   刻意做得很轻 —— 不点它们的时候，板面就是一块干净的白板。 */
.wb-acts{
  position:absolute;left:0;top:0;z-index:4;
  display:inline-flex;gap:2px;
}
.wb-acts[hidden]{display:none}
.wb-act{
  border:0;border-radius:6px;background:none;cursor:pointer;
  font:inherit;font-size:calc(12px * var(--math-fs));line-height:1;padding:5px 8px;
  color:var(--math-ink-3);
}
.wb-act:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-act:focus-visible{outline:2px solid var(--math-primary);outline-offset:1px}
.wb-act.is-on{background:var(--math-primary-tint);color:var(--math-primary)}
.wb-act.is-on:hover{background:var(--math-primary-200)}
.wb-act:disabled{color:var(--math-ink-4);cursor:default;background:none}
/* ---------- 思路框（分析）：题目右侧一个框，里面是编号的思路 ----------
   只读。原来做成 4~5 个可写的"台阶框"，用户看过真实效果后否掉了：
   「分析不用搞那么多台阶框……就直接出一个框，主体思路是一二三四五六七八……它的目的就是看」。
   字号不跟着画布缩放：这是要读的字，缩到 15% 就没法看了。 */
.wb-think{
  position:absolute;left:0;top:0;z-index:4;
  width:238px;padding:8px 10px 9px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-md);
  background:var(--math-popover);box-shadow:var(--math-shadow-1);
  /* 上限 8 步 × 大字号时，内容能高过整块画布 —— 不封顶的话框底那个按钮就再也点不到了。
     封顶之后由列表自己滚：框始终在板内，读不完也够得着。 */
  display:flex;flex-direction:column;max-height:calc(100% - 32px);
}
.wb-think[hidden]{display:none}
.wb-think__head{flex:none;display:flex;align-items:center;gap:7px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wb-think.is-dragging{box-shadow:var(--math-shadow-2)}
.wb-think.is-dragging .wb-think__head{cursor:grabbing}
.wb-think__title{font-size:calc(12.5px * var(--math-fs));font-weight:600;color:var(--math-foreground)}
.wb-think__count{font-size:calc(11.5px * var(--math-fs));color:var(--math-ink-3)}
.wb-think__grip{flex:none;margin-left:auto;width:14px;height:14px;color:var(--math-ink-4)}
.wb-think__list{margin:7px 0 0;padding:0;list-style:none;overflow-y:auto;min-height:0}
.wb-think__foot{flex:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--math-border)}
.wb-think__act{
  width:100%;height:28px;border:1px solid var(--math-border);border-radius:var(--math-radius-sm);
  background:none;color:var(--math-ink-2);cursor:pointer;
  font-family:var(--math-font-sans);font-size:calc(11.5px * var(--math-fs));
  transition:color 140ms cubic-bezier(.2,.8,.2,1),border-color 140ms cubic-bezier(.2,.8,.2,1);
}
.wb-think__act:hover{color:var(--math-primary);border-color:var(--math-primary)}
.wb-think__act:focus-visible{outline:2px solid var(--math-primary);outline-offset:1px}
.wb-think__act[aria-pressed="true"]{color:var(--math-primary);background:var(--math-primary-soft);border-color:var(--math-primary-tint)}

/* ---------- 答案块：直接写在题目下方 ---------- */
.wb-answer{
  position:absolute;left:0;top:0;z-index:4;
  width:300px;padding:9px 11px 10px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-md);
  background:var(--math-popover);box-shadow:var(--math-shadow-1);
  /* 同思路框：注释全展开时分步能很长，封顶 + 自己滚，别顶出画布 */
  display:flex;flex-direction:column;max-height:calc(100% - 32px);
}
.wb-answer[hidden]{display:none}
.wb-answer__head{flex:none;display:flex;align-items:center;gap:7px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wb-answer.is-dragging{box-shadow:var(--math-shadow-2)}
.wb-answer.is-dragging .wb-answer__head{cursor:grabbing}
.wb-answer__title{font-size:calc(12.5px * var(--math-fs));font-weight:600;color:var(--math-foreground)}
/* 「AI 生成」是实话标注：这是模型给的答案，不是老师批的 */
.wb-answer__flag{
  padding:1px 6px;border-radius:var(--math-radius-pill);
  background:var(--math-primary-soft);color:var(--math-primary);
  font-size:calc(10.5px * var(--math-fs));
}
.wb-answer__notes{
  margin-left:auto;padding:0 6px;height:22px;border:1px solid var(--math-border);
  border-radius:var(--math-radius-sm);background:none;color:var(--math-ink-2);cursor:pointer;
  font-family:var(--math-font-sans);font-size:calc(11px * var(--math-fs));
}
.wb-answer__notes[hidden]{display:none}
.wb-answer__notes[aria-pressed="true"]{color:var(--math-primary);border-color:var(--math-primary-tint);background:var(--math-primary-soft)}
.wb-answer__notes:focus-visible{outline:2px solid var(--math-primary);outline-offset:1px}
.wb-answer__grip{flex:none;width:14px;height:14px;color:var(--math-ink-4)}
/* 结果单独一行、主色加重 —— 先看结论再看过程 */
.wb-answer__result{
  flex:none;margin:8px 0 0;padding:6px 8px;border-radius:var(--math-radius-sm);
  background:var(--math-surface);color:var(--math-foreground);
  font-family:var(--math-font-math);font-size:calc(15px * var(--math-fs));font-weight:600;
}
.wb-answer__steps{margin:6px 0 0;padding:0;list-style:none;overflow-y:auto;min-height:0}

/* ---------- 编号条目：思路 / 答案 / 转文字三处共用这一套 ---------- */
.wb-tile{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:6px 0;border-top:1px solid var(--math-border)}
.wb-tile:first-child{border-top:0;padding-top:2px}
.wb-tile__no{
  flex:none;width:17px;height:17px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--math-primary-tint);color:var(--math-primary);
  font-size:calc(10.5px * var(--math-fs));font-weight:600;
}
.wb-tile__text{
  flex:1;min-width:0;font-size:calc(12.5px * var(--math-fs));line-height:1.6;color:var(--math-foreground);
  outline:none;
}
.wb-tile__text:focus{background:var(--math-background);box-shadow:0 0 0 2px var(--math-primary-tint);border-radius:var(--math-radius-xs)}
/* 注释（AI 给的那句"为什么这么想"）单独占一行，缩进到正文下面。
   46px = 23（让开编号列：17px 圆点 + 6px 间距）+ 23（再往里缩一格，才看得出"这是附在正文下的"）。
   注意用 padding 而不是 margin：这行是 flex:1 0 100%（basis 已经是整行宽），
   再加 margin 就超出容器了，浏览器会把它吞掉 —— 真机上就是"注释和正文齐平、看着像正文"。 */
.wb-tile__cmt{
  flex:1 0 100%;box-sizing:border-box;padding-left:46px;
  font-size:calc(11.5px * var(--math-fs));line-height:1.7;color:var(--math-ink-2);
}
.wb-tile__cmt[hidden]{display:none}
.wb-tile__tone{font-weight:600}
.wb-tile[data-tone="ok"] .wb-tile__tone{color:var(--math-state-success)}
.wb-tile[data-tone="careful"] .wb-tile__tone{color:var(--math-state-warning,#b45309)}
.wb-tile[data-tone="warn"] .wb-tile__tone{color:var(--math-state-error)}

/* ---------- 「上传我的题」的实话便签 ---------- */
.wb-note{
  position:absolute;left:0;top:0;z-index:5;max-width:280px;padding:9px 11px;
  border:1px solid var(--math-border);border-radius:var(--math-radius-md);
  background:var(--math-popover);box-shadow:var(--math-shadow-2);
}
.wb-note[hidden]{display:none}
.wb-note__title{margin:0;font-size:calc(12.5px * var(--math-fs));font-weight:600;color:var(--math-foreground)}
.wb-note__text{margin:5px 0 0;font-size:calc(11.5px * var(--math-fs));line-height:1.7;color:var(--math-ink-2)}

  </style>
</head>

          <div class="wb-think" id="wb-think" role="group" aria-label="这道题的思路" hidden>

            <ol class="wb-answer__steps" id="wb-answer-steps"></ol>

          <!-- 「上传我的题」的实话：拍照 / 传图识别还没做（在 Plan 3）。
               按钮先占住位置（这一排要三个，位置定下来就不返工），点了给一句实话 + 一条现在就能走的路，
               不做点了没反应的假按钮。 -->
          <div class="wb-note" id="wb-upload-tip" role="status" hidden>
            <p class="wb-note__title">拍照上传还在做</p>
            <p class="wb-note__text">现在可以：① 在题库里选一道题上板；② 用笔写出你的推导，再点思路框底部的「把手写转成文字」生成电子版。</p>

          <!-- 题目下方那一块：手写转文字。位置由白板按世界坐标投影出来，

          <div class="wb-ink" id="wb-ink-text" role="group" aria-label="手写转文字" hidden>

            </div>
            <p class="wb-ink__note" id="wb-ink-note"></p>
            <ol class="wb-ink__steps" id="wb-ink-steps"></ol>
            <div class="wb-ink__acts" id="wb-ink-acts">
              <button type="button" class="wb-ink__btn" id="wb-ink-again">重新识别</button>
              <button type="button" class="wb-ink__btn" id="wb-ink-clear">移除</button>
            </div>

        </div>

        <aside class="wb-bank" id="wb-bank" aria-label="题库" hidden>
          <div class="wb-bank__head" id="wb-bank-head">
            <i data-lucide="grip-vertical" class="wb-bank__grip" aria-hidden="true"></i>
            <span class="wb-bank__title">题库</span>
            <span class="wb-bank__count" id="wb-bank-count"></span>

          <div class="wb-filters" id="wb-books" role="group" aria-label="按册筛选">

    <link rel="stylesheet" href="assets/css/ide.css">
    <!-- 白板页专属覆盖：白板底部有工具条，而全站 toast 的 bottom:28px 会正好压在工具栏上。
         位置必须在样式表 <link> **之后** —— 同权重下靠文档顺序取胜，放前面会被 shell.css 盖掉。
         选择器写 body .toast-stack 而不是 .wb-shell .toast-stack：toast 挂在 document.body 上，
         根本不在页面外壳（main.wb-shell）里面。 -->
    <style id="wb-page-styles">
/* 18(工具条离底) + 46(工具条高) + 12(间隙) = 76 */
body .toast-stack{bottom:calc(76px + env(safe-area-inset-bottom))}
/* 设置面板多了一行「网格」后更高了（真机 281px）。它靠 bottom:74px 往上长，
   矮屏上要把顶上一截切掉 —— 给个兜底：超过可视高度就自己滚，绝不切。
   654px 高的窗口下这条不会生效（281 < 554），只在极矮的窗口里兜底。 */
.wb-pop{max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain}
/* 板面选择器：三个小色块按钮，色块就是那块板的底色。 */
.wb-themes{display:flex;gap:6px}
.wb-theme{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--math-border);border-radius:6px;
  background:none;cursor:pointer;font:inherit;font-size:calc(12px * var(--math-fs));line-height:1;
  padding:4px 7px;color:var(--math-ink-3);
}
.wb-theme:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-theme:focus-visible{outline:2px solid var(--math-primary);outline-offset:1px}
.wb-theme.is-on{border-color:transparent;background:var(--math-primary-tint);color:var(--math-primary)}
.wb-theme__chip{
  flex:none;width:14px;height:14px;border-radius:4px;
  border:1px solid var(--math-border);
}
/* 网格疏密：三个小按钮，块里那格"预览"就是这个疏密画出来的样子。
   方向必须是数值越小格子越密（20 → 4px，80 → 9px），写反了就是误导。
   三档在极端缩放下会被自动疏密修正拉到同一档，这一点在说明里如实写了。 */
.wb-grids{display:flex;gap:6px}
.wb-grid{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--math-border);border-radius:6px;
  background:none;cursor:pointer;font:inherit;font-size:calc(12px * var(--math-fs));line-height:1;
  padding:4px 7px;color:var(--math-ink-3);
}
.wb-grid:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-grid:focus-visible{outline:2px solid var(--math-primary);outline-offset:1px}
.wb-grid.is-on{border-color:transparent;background:var(--math-primary-tint);color:var(--math-primary)}
.wb-grid__chip{
  flex:none;width:14px;height:14px;border-radius:4px;
  border:1px solid var(--math-border);
  background-image:
    linear-gradient(to right,var(--math-border) 1px,transparent 1px),
    linear-gradient(to bottom,var(--math-border) 1px,transparent 1px);
}
.wb-grid[data-wb-grid="20"] .wb-grid__chip{background-size:4px 4px}
.wb-grid[data-wb-grid="40"] .wb-grid__chip{background-size:6px 6px}
.wb-grid[data-wb-grid="80"] .wb-grid__chip{background-size:9px 9px}

/* ---------- 题面下方：手写转文字 ----------
   位置由白板按世界坐标投影（见 layoutBelow），这里只管长相。
   文字那格是 contenteditable —— 识别一定会出错，必须能改。 */
.wb-ink{
  position:absolute;z-index:5;width:min(360px,calc(100% - 16px));
  padding:10px 12px 11px;border:1px solid var(--math-border);border-radius:var(--math-radius-md,10px);
  background:var(--math-background);box-shadow:0 10px 28px rgba(15,23,42,.14);
}
.wb-ink[hidden]{display:none}
.wb-ink__head{display:flex;align-items:center;gap:7px}
.wb-ink__title{font-size:calc(12.5px * var(--math-fs));font-weight:600;color:var(--math-foreground)}
.wb-ink__badge{
  padding:1px 6px;border-radius:999px;background:var(--math-surface);
  font-size:calc(10.5px * var(--math-fs));letter-spacing:.06em;color:var(--math-ink-3);
}
.wb-ink__badge[hidden]{display:none}
.wb-ink__close{
  margin-left:auto;width:22px;height:22px;display:grid;place-items:center;
  border:0;border-radius:var(--math-radius-sm);background:none;color:var(--math-ink-3);
  font-size:calc(15px * var(--math-fs));line-height:1;cursor:pointer;
}
.wb-ink__close:hover{background:var(--math-surface);color:var(--math-foreground)}
/* 转文字面板里的条目是**另一种**排法：编号是「第 1 步」这种文字标签（进不了 17px 圆点），
   正文是一格可改的输入框。所以这里按 .wb-ink 限定作用域另写一套 ——
   千万别写成不带前缀的 .wb-tile__no：那是三处共用的那套，会连思路框 / 答案块一起改掉
   （真机复核抓到过：不带前缀的旧样式把答案块的编号压成了灰色小字、正文还多了一层底）。
   共用那份只管形状（圆点编号 + 正文 + 注释），面板这份只管"能改的输入框"。 */
.wb-ink .wb-tile{display:block}
.wb-ink .wb-tile__no{
  display:block;font-family:var(--math-font-mono);font-size:calc(10.5px * var(--math-fs));
  letter-spacing:.06em;color:var(--math-ink-4);
}
.wb-ink .wb-tile__text{
  margin-top:3px;padding:3px 5px;border-radius:var(--math-radius-sm);
  font-size:calc(13.5px * var(--math-fs));line-height:1.7;color:var(--math-foreground);
  background:var(--math-surface);outline:none;white-space:pre-wrap;
}
.wb-ink .wb-tile__text:focus{background:var(--math-background);box-shadow:0 0 0 2px var(--math-primary-tint)}
.wb-ink .wb-tile__cmt{margin:5px 0 0}
.wb-ink .wb-tile__tone{
  display:inline-block;margin-right:5px;padding:0 5px;border-radius:999px;
  font-size:calc(10.5px * var(--math-fs));line-height:1.6;background:var(--math-surface);color:var(--math-ink-3);
}
.wb-ink__acts{display:flex;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--math-border)}
.wb-ink__acts[hidden]{display:none}
.wb-ink__btn{
  height:26px;padding:0 10px;border:1px solid var(--math-border);border-radius:6px;
  background:none;font:inherit;font-size:calc(12px * var(--math-fs));line-height:1;color:var(--math-ink-3);cursor:pointer;
}
.wb-ink__btn:hover{background:var(--math-surface);color:var(--math-foreground)}
.wb-ink__btn:focus-visible{outline:2px solid var(--math-primary);outline-offset:1px}
    </style>
