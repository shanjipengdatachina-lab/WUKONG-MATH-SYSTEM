    <main>
      <div class="wrap" id="exams-app">
        <!-- 头部 -->
        <div class="phead">
          <div>
            <h1 class="phead__title">真题题库</h1>
            <p class="phead__desc">中考 · 高考 · 模拟卷真题，按章节 / 年份 / 题型筛着做。<span id="exams-count-note" class="dim"></span></p>
          </div>
          <div class="phead__actions">
            <a class="btn btn--ghost" href="practice.html" data-dom-id="exam-quick">考点速练</a>
          </div>
        </div>

        <!-- 筛选条 -->
        <div class="filters" id="exams-filters">
          <select id="f-year" class="f-select" aria-label="年份"><option value="">全部年份</option></select>
          <select id="f-region" class="f-select" aria-label="地区"><option value="">全部地区</option></select>
          <select id="f-paper" class="f-select" aria-label="卷型"><option value="">全部卷型</option></select>
          <select id="f-qtype" class="f-select" aria-label="题型"><option value="">全部题型</option></select>
          <select id="f-kind" class="f-select" aria-label="判分类型">
            <option value="">全部</option>
            <option value="choice">选择题</option>
            <option value="blank">填空题</option>
            <option value="board">白板题</option>
          </select>
          <button class="btn btn--ghost btn--sm" id="f-reset" type="button">重置</button>
        </div>

        <!-- 题目列表 -->
        <div class="qlist" id="exams-list">
          <p class="qlist__empty">加载中…</p>
        </div>

        <!-- 详情 / 答题区（点击列表项展开） -->
        <div class="qview" id="exams-detail" hidden>
          <button class="qview__back" id="exams-back" type="button">← 返回列表</button>
          <div class="qview__body" id="exams-detail-body"></div>
        </div>
      </div>
    </main>

    <style id="shell-styles">
